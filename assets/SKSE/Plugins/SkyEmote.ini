[Input]
; DirectInput keyboard scan code. 26 is [. Empty/invalid bindings default to [.
MenuKey=26
; Optional global Stop animation key. 0 leaves it unbound.
StopKey=0
; Optional Quick Emote activation key. 0 leaves it unbound.
QuickEmoteKey=0
; Seconds to wait for a favorite while player/camera controls are captured.
QuickEmoteTimeoutSeconds=5

; Menu cursor speed multiplier. Increase for low-DPI mice, for example 2.0.
; 1.0 follows Skyrim's native menu cursor. Does not change camera sensitivity.
MouseSensitivity=1.0
